name: GKUIBleKey
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  GKUIBleKey:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "**/*.md"
          # ★ Widget 扩展的 UI 代码不能编进主 App（它有自己的 @main），
          #   但 `Sources/LiveActivity` 的共享类型两边都要编。
          - "Widget/**"
          # ★ 手表端有自己的一套 @main 与 UI，不能编进手机 App。
          - "Watch/**"
      - path: Resources
    dependencies:
      - target: GKUIBleKeyWidget
      # ★ 手表 App 嵌入主 App（2026-10-30 22:10 打开）
      #
      # 为什么走嵌入而不是让 Mac 直连手表：
      #   `devicectl` 直连手表要求 Mac↔手表 的 remote pairing 隧道在线，
      #   实测常见 `RemotePairingError 1035 / Device State: disconnected`，
      #   一旦断就连不上（还要求手表戴在手上、解锁、靠近 Mac）。
      #   嵌入后走 **iPhone ↔ 手表** 那条天然配对关系，在 iPhone 的
      #   Watch App 里点安装即可，成功率远高于直连。
      #
      # 前提已满足：`com.mmxisme.gkuiblekey.watchkitapp` 的 profile 已在
      #   2026-10-30 22:06 由 Xcode 生成（有效期到 11-06）。
      - target: GKUIBleKeyWatch
        embed: true
    settings:
      base:
        # 关于 bundle id 与 IDFV（2026-10-29 调查结论，避免以后重复踩坑）
        #
        # GLBLEAuthSDK 里存在 `VKKeychainIDFV` / `VKgetIdfvFromKeyChain` /
        # `VKsaveIdfvToKeyChain:` / `mobileID`，说明原 App 把 IDFV 持久化在 Keychain
        # 当 mobileId 使用。IDFV 按 bundle id **前两段（vendor）** 分组，所以理论上
        # 改成 `cn.com.ecarx.*` 就能与原 App 共享同一个 IDFV。
        #
        # **但实测不可行**：本机只有一个 explicit App ID 的 profile
        # （2PQ29MSM39.com.mmxisme.gkuiblekey），Xcode 未登录账号（No Accounts），
        # 换 bundle id 无法自动生成 profile → 构建直接失败。
        # 另外本 App 自己已实现 IDFV 的 Keychain 持久化（KeyStore.idfvDisplay），
        # 重复安装不会改变上送值，所以这条路暂不是缺口。
        PRODUCT_BUNDLE_IDENTIFIER: com.mmxisme.gkuiblekey
        PRODUCT_NAME: GKUIBleKey
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        # 真机部署需要签名。
        # Team ID 取自证书 OU 字段：Apple Development: mmxisme@icloud.com
        #   subject=UID=CYAGCJ8C34, OU=2PQ29MSM39, O=MINGXING MU
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2PQ29MSM39
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        # ★ 修复 Xcode 27.1 命令行 `xcodebuild` 的 SwiftUI 宏展开失败：
        #   默认不传 -plugin-path，导致 @State 等宏报
        #   "SwiftUIMacros.StateMacro ... malformed response"。
        #   显式指向宏库目录后，命令行与 GUI 构建均正常。
        OTHER_SWIFT_FLAGS: "-plugin-path /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/usr/lib/swift/host/plugins"
        # ★ 禁止 Xcode 把 PNG 转成 CgBI 格式（苹果专有优化格式）。
        #   原 App 提取的车辆模型帧是 colormap/特殊 alpha 的 PNG，
        #   转 CgBI 后真机 `Image(named:)` 可能解码失败导致车图不显示。
        #   保留标准 RGBA PNG，交给 UIImage 直接解码。
        COMPRESS_PNG_FILES: NO

  # ── Live Activity 扩展 ─────────────────────────────────────────
  # 存在的唯一理由：拿到后台等同前台的 Core Bluetooth 权限。
  # Apple 文档（iOS 26+）要求「有 CBManager 实例 + 启动 Live Activity」，
  # 满足后后台扫描才能关闭 duplicates 合并（即 AllowDuplicates 生效）。
  GKUIBleKeyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      # 只共享「数据类型」。`LiveActivityController` 依赖主 App 的 FileLogger，
      # 不能编进扩展（扩展里没有那个符号，也不该带整套日志）。
      - path: Sources/LiveActivity/VehicleActivityAttributes.swift
    info:
      path: Sources/Widget/Info.plist
      # ★ 这里的 properties 会被 xcodegen **整份重写**进 Info.plist，
      #   手改 Sources/Widget/Info.plist 会在下次 `xcodegen generate` 时被抹掉。
      #   所以凡是要保留的键都必须写在这里。
      properties:
        CFBundleDisplayName: 数字钥匙
        # 扩展版本必须与宿主 App 一致，否则 App Store 上传报 ITMS-90473
        CFBundleShortVersionString: "8.4"
        CFBundleVersion: "84"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mmxisme.gkuiblekey.widget
        PRODUCT_NAME: GKUIBleKeyWidget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Widget/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2PQ29MSM39
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        SKIP_INSTALL: YES
        OTHER_SWIFT_FLAGS: "-plugin-path /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/usr/lib/swift/host/plugins"

  # ── Apple Watch 端（2026-10-30 建，同日改回 A 方案）────────────────
  # 手表端 = **独立的钥匙**，自己连车、自己配对。
  #
  # 为什么不是「手机遥控器」：
  #   BLE 的绑定密钥（LTK/IRK）确实导不出来，但那只说明**不能复用手机的绑定**，
  #   不等于手表不能有自己的绑定。车端一车可挂 **5 台**设备，
  #   手表自己走一遍「诊断仪开窗口 → 6 位码 → 0x0D → 0x0E」就拿到
  #   属于自己槽位的密钥（详见 INBLUE_PROTOCOL_SPEC 5.10）。
  #   遥控方案的代价是「iPhone 必须在附近且 App 能被唤起」——
  #   而用户要的正是「手机不在也能开车」。
  #
  # 手表端刻意不做的三件事（省电 + 避免与手机端语义冲突）：
  #   1. 预认证心跳 0x0C（手表不做无感进入）
  #   2. 常开扫描（ble.autoScanOnDisconnect = false，只在用户操作时扫）
  #   3. 从 iPhone 同步密钥（会覆盖手表自己的槽位密钥，且 5.10 标注未验证）
  GKUIBleKeyWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    # 手表端需要完整协议栈：BLE 传输 + 会话状态机 + 0x0D 配对帧 + Keychain。
    # 只排除 iOS-only 的几块（App/UI/Intents/LiveActivity/Widget/Security）。
    sources:
      - path: Sources/Watch
      - path: Sources/Protocol
      - path: Sources/Keychain
      - path: Sources/BLE
      # 密码学原语（AES / HMAC）：Foundation + CryptoKit + CommonCrypto，watchOS 全有
      - path: Sources/Crypto
      # BLE 层依赖的两个支撑文件（都只有 Foundation；UIApplication 部分已用 #if os(iOS) 隔离）
      - path: Sources/Support/FileLogger.swift
      - path: Sources/Support/BackgroundMonitor.swift
    info:
      path: Sources/Watch/Info.plist
      # ★ 同 Widget：properties 会被 xcodegen 整份重写。
      #   **`NSBluetoothAlwaysUsageDescription` 必须写在这里** ——
      #   缺了它，watchOS 上 `CBCentralManager` 直接进 `unauthorized`，
      #   一个设备都扫不到，且不会报错（v7.4 就踩过：手改 plist 被抹掉）。
      properties:
        CFBundleDisplayName: 蓝牙钥匙
        CFBundleShortVersionString: "8.4"
        CFBundleVersion: "84"
        NSBluetoothAlwaysUsageDescription: 手表需要使用蓝牙连接车辆蓝牙钥匙模块，完成配对与车门控制。
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.mmxisme.gkuiblekey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mmxisme.gkuiblekey.watchkitapp
        PRODUCT_NAME: GKUIBleKeyWatch
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Watch/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2PQ29MSM39
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        SKIP_INSTALL: YES
        # 宏插件路径要指到 watchOS 平台，指 iPhoneOS 会展开失败
        OTHER_SWIFT_FLAGS: "-plugin-path /Applications/Xcode.app/Contents/Developer/Platforms/WatchOS.platform/Developer/usr/lib/swift/host/plugins"
