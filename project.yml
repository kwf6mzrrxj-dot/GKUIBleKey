name: GKUIBleKey
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  GKUIBleKey:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "**/*.md"
          # ★ Widget 扩展的 UI 代码不能编进主 App（它有自己的 @main），
          #   但 `Sources/LiveActivity` 的共享类型两边都要编。
          - "Widget/**"
      - path: Resources
    settings:
      base:
        # 关于 bundle id 与 IDFV（2026-10-29 调查结论，避免以后重复踩坑）
        #
        # GLBLEAuthSDK 里存在 `VKKeychainIDFV` / `VKgetIdfvFromKeyChain` /
        # `VKsaveIdfvToKeyChain:` / `mobileID`，说明原 App 把 IDFV 持久化在 Keychain
        # 当 mobileId 使用。IDFV 按 bundle id **前两段（vendor）** 分组，所以理论上
        # 改成 `cn.com.ecarx.*` 就能与原 App 共享同一个 IDFV。
        #
        # **但实测不可行**：本机只有一个 explicit App ID 的 profile
        # （2PQ29MSM39.com.mmxisme.gkuiblekey），Xcode 未登录账号（No Accounts），
        # 换 bundle id 无法自动生成 profile → 构建直接失败。
        # 另外本 App 自己已实现 IDFV 的 Keychain 持久化（KeyStore.idfvDisplay），
        # 重复安装不会改变上送值，所以这条路暂不是缺口。
        PRODUCT_BUNDLE_IDENTIFIER: com.mmxisme.gkuiblekey
        PRODUCT_NAME: GKUIBleKey
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        # 真机部署需要签名。
        # Team ID 取自证书 OU 字段：Apple Development: mmxisme@icloud.com
        #   subject=UID=CYAGCJ8C34, OU=2PQ29MSM39, O=MINGXING MU
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2PQ29MSM39
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        # ★ 修复 Xcode 27.1 命令行 `xcodebuild` 的 SwiftUI 宏展开失败：
        #   默认不传 -plugin-path，导致 @State 等宏报
        #   "SwiftUIMacros.StateMacro ... malformed response"。
        #   显式指向宏库目录后，命令行与 GUI 构建均正常。
        OTHER_SWIFT_FLAGS: "-plugin-path /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/usr/lib/swift/host/plugins"
        # ★ 禁止 Xcode 把 PNG 转成 CgBI 格式（苹果专有优化格式）。
        #   原 App 提取的车辆模型帧是 colormap/特殊 alpha 的 PNG，
        #   转 CgBI 后真机 `Image(named:)` 可能解码失败导致车图不显示。
        #   保留标准 RGBA PNG，交给 UIImage 直接解码。
        COMPRESS_PNG_FILES: NO

